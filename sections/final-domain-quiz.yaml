# Final domain knowledge check across all three sections.
schema_version: 1
kind: question_bank
id: ats098-final
course_id: ATS098
exam_code: FLUX
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: image-automation-progressive-delivery
  title: "Image Automation & Progressive Delivery"
questions:
  - id: ats098-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Write the image field of an ImageRepository"
    source_readings:
      - sections/section-010/module-01/course-01-scanning-with-imagerepository.md
    prompt: "Which value is correct for the `image` field of an ImageRepository that scans the lab registry?"
    options:
      - id: a
        text: "`http://registry.localtest.me:5000/podinfo`"
        explanation: "Not correct. The field takes no scheme such as http://."
      - id: b
        text: "`registry.localtest.me:5000/podinfo`"
        explanation: "Correct. The field holds the registry address and the repository, with no scheme and no tag."
      - id: c
        text: "`registry.localtest.me:5000/podinfo:6.15.0`"
        explanation: "Not correct. The field takes no tag. Choosing a tag is the job of an ImagePolicy."
      - id: d
        text: "`podinfo:6.15.0`"
        explanation: "Not correct. The registry address is missing and a tag must not be there."
    correct_option: b
    explanation: "Correct. The field holds the registry address and the repository, with no scheme and no tag."

  - id: ats098-final-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Find the tag an ImagePolicy chose"
    source_readings:
      - sections/section-010/module-01/course-02-choosing-a-tag-with-imagepolicy.md
    prompt: "Where does Flux store the tag that an ImagePolicy chose?"
    options:
      - id: a
        text: "In `.status.lastScanResult.latestTags` of the ImageRepository"
        explanation: "Not correct. That list is a sample of recent tags, not the choice."
      - id: b
        text: "In `.spec.policy` of the ImagePolicy"
        explanation: "Not correct. The spec holds the rule, not the result."
      - id: c
        text: "In the image field of the running Deployment"
        explanation: "Not correct. The Deployment changes only after Git changes."
      - id: d
        text: "In `.status.latestRef.tag` of the ImagePolicy"
        explanation: "Correct. `flux get image policy` shows this value."
    correct_option: d
    explanation: "Correct. `flux get image policy` shows this value."

  - id: ats098-final-q03
    type: single_choice
    difficulty: advanced
    learning_objective: "Combine extract with a numerical rule"
    source_readings:
      - sections/section-010/module-01/course-03-filtering-and-extracting-build-tags.md
    prompt: "A pattern ends in `-(?P<ts>[0-9]+)$`. Which settings sort the tags by that timestamp, and what does `.status.latestRef.tag` hold?"
    options:
      - id: a
        text: "`extract: '$ts'` with `numerical`; it holds the full tag of the winner"
        explanation: "Correct. The extracted value is only used for sorting. The status keeps the full tag."
      - id: b
        text: "`extract: '$ts'` with `numerical`; it holds only the timestamp"
        explanation: "Not correct. The status always holds the full tag."
      - id: c
        text: "`extract: 'ts'` with `alphabetical`; it holds the full tag"
        explanation: "Not correct. The value needs the `$` and a number sorts as text under `alphabetical`."
      - id: d
        text: "`numerical` on the whole tag; it holds the full tag"
        explanation: "Not correct. A tag such as `main-0c1d2e3-1760007200` is not a number, so the policy reports an error."
    correct_option: a
    explanation: "Correct. The extracted value is only used for sorting. The status keeps the full tag."

  - id: ats098-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the marker form that writes only the tag"
    source_readings:
      - sections/section-020/module-01/course-01-setter-markers.md
    prompt: "Which marker makes the automation write only the tag of the policy `podinfo` in `flux-system`?"
    options:
      - id: a
        text: "`# {\"$imagepolicy\": \"flux-system:podinfo\"}`"
        explanation: "Not correct. Without a suffix the full reference is written."
      - id: b
        text: "`# {\"$imagepolicy\": \"flux-system:podinfo:name\"}`"
        explanation: "Not correct. The `:name` suffix writes the image name only."
      - id: c
        text: "`# {\"$imagepolicy\": \"flux-system:podinfo:tag\"}`"
        explanation: "Correct. The `:tag` suffix writes the tag only."
      - id: d
        text: "`# {\"$imagepolicy\": \"flux-system:podinfo:digest\"}`"
        explanation: "Not correct. The `:digest` suffix writes the digest and needs `digestReflectionPolicy`."
    correct_option: c
    explanation: "Correct. The `:tag` suffix writes the tag only."

  - id: ats098-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order the steps of an ImageUpdateAutomation run"
    source_readings:
      - sections/section-020/module-01/course-02-image-update-automation.md
    prompt: "Which order describes one run of the image automation controller?"
    options:
      - id: a
        text: "Find markers, clone the branch, push, then commit"
        explanation: "Not correct. The controller needs the files before it can find markers, and it commits before it pushes."
      - id: b
        text: "Scan the registry, choose a tag, replace the values, apply to the cluster"
        explanation: "Not correct. Scanning belongs to the reflector controller and applying to Flux."
      - id: c
        text: "Commit, replace the values, clone the branch, push"
        explanation: "Not correct. It must clone before it can change anything."
      - id: d
        text: "Clone the branch, find markers under `update.path`, replace the values, commit if a file changed, push"
        explanation: "Correct. A run without changes makes no commit."
    correct_option: d
    explanation: "Correct. A run without changes makes no commit."

  - id: ats098-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use push.branch for reviewed releases"
    source_readings:
      - sections/section-020/module-01/course-03-commits-authors-and-branches.md
    prompt: "The automation checks out `main` and has `push.branch: image-updates`. When does a new tag reach the cluster?"
    options:
      - id: a
        text: "Immediately, because the automation commits"
        explanation: "Not correct. Flux does not apply the branch `image-updates`."
      - id: b
        text: "After someone merges `image-updates` into `main`, because Flux applies `main`"
        explanation: "Correct. Until the merge, the release waits in the branch."
      - id: c
        text: "Never, because pushing to another branch is not allowed"
        explanation: "Not correct. It is allowed and used for review."
      - id: d
        text: "After the next scan of the registry"
        explanation: "Not correct. A scan does not merge branches."
    correct_option: b
    explanation: "Correct. Until the merge, the release waits in the branch."

  - id: ats098-final-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain how Flagger shifts traffic with nginx"
    source_readings:
      - sections/section-030/module-01/course-01-flagger-and-the-canary-resource.md
    prompt: "With `provider: nginx`, how does Flagger shift traffic to a new version?"
    options:
      - id: a
        text: "It proxies every request itself"
        explanation: "Not correct. Flagger does not handle user requests."
      - id: b
        text: "It edits the iptables rules on each node"
        explanation: "Not correct. Flagger works through the Ingress."
      - id: c
        text: "It changes the weight of a canary Ingress that ingress-nginx uses"
        explanation: "Correct. Flagger tells the router the share. The router sends the requests."
      - id: d
        text: "It scales the old Deployment down in steps"
        explanation: "Not correct. Scaling does not set a share of requests."
    correct_option: c
    explanation: "Correct. Flagger tells the router the share. The router sends the requests."

  - id: ats098-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what starts an analysis"
    source_readings:
      - sections/section-030/module-01/course-02-canary-analysis-promotion-and-rollback.md
    prompt: "What starts a Flagger analysis?"
    options:
      - id: a
        text: "A change to the pod template of the target Deployment, such as a new image tag"
        explanation: "Correct. A change to the Canary alone does not start one."
      - id: b
        text: "Any change to the Canary object"
        explanation: "Not correct. Only a change to the target Deployment starts it."
      - id: c
        text: "A new commit anywhere in the repository"
        explanation: "Not correct. Only a changed pod template matters."
      - id: d
        text: "Creating the Ingress `podinfo-canary`"
        explanation: "Not correct. Flagger creates that Ingress itself."
    correct_option: a
    explanation: "Correct. A change to the Canary alone does not start one."

  - id: ats098-final-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Set the limit of a custom latency metric"
    source_readings:
      - sections/section-030/module-01/course-03-ab-testing-blue-green-and-metrics.md
    prompt: "A MetricTemplate returns the 99th percentile request duration in seconds. Which `thresholdRange` fails a canary that is too slow?"
    options:
      - id: a
        text: "`min: 0.5`"
        explanation: "Not correct. A minimum would fail fast responses."
      - id: b
        text: "`max: 0.5`"
        explanation: "Correct. Latency needs a maximum. A higher value fails the check."
      - id: c
        text: "`min: 99`"
        explanation: "Not correct. That value fits a success rate in percent."
      - id: d
        text: "`stepWeight: 0.5`"
        explanation: "Not correct. That is not a `thresholdRange` field."
    correct_option: b
    explanation: "Correct. Latency needs a maximum. A higher value fails the check."

  - id: ats098-final-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Name what answers the login challenge of a registry"
    source_readings:
      - sections/section-010/module-02/course-01-how-the-reflector-authenticates.md
    prompt: "A registry answers `401 Unauthorized`. What does the image reflector controller do next?"
    options:
      - id: a
        text: "Sends the credentials named by the `ImageRepository` and repeats the request"
        explanation: "Correct. The `WWW-Authenticate` header says how to log in, and the controller answers it."
      - id: b
        text: "Marks the policy `Ready` with the last known tag"
        explanation: "Not correct. The scan fails without a login."
      - id: c
        text: "Deletes the `ImageRepository`"
        explanation: "Not correct. The controller never deletes objects."
      - id: d
        text: "Asks the Git repository for a password"
        explanation: "Not correct. Passwords are not read from Git."
    correct_option: a
    explanation: "Correct. The `WWW-Authenticate` header says how to log in, and the controller answers it."

  - id: ats098-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Create the Secret for a registry login"
    source_readings:
      - sections/section-010/module-02/course-02-credentials-with-secretref.md
    prompt: "Which command creates a Secret of the type `kubernetes.io/dockerconfigjson` for a registry login?"
    options:
      - id: a
        text: "`kubectl create secret generic --from-literal=password=...`"
        explanation: "Not correct. It creates an `Opaque` Secret."
      - id: b
        text: "`kubectl create secret docker-registry` with `--docker-server`, `--docker-username` and `--docker-password`"
        explanation: "Correct. It writes the `.dockerconfigjson` key."
      - id: c
        text: "`flux create secret git`"
        explanation: "Not correct. That Secret holds a Git login."
      - id: d
        text: "`kubectl create secret tls`"
        explanation: "Not correct. That Secret holds a certificate and a key."
    correct_option: b
    explanation: "Correct. It writes the `.dockerconfigjson` key."

  - id: ats098-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose where a shared login belongs"
    source_readings:
      - sections/section-010/module-02/course-03-service-accounts-and-shared-credentials.md
    prompt: "Several scans in one namespace use the same registry login. Which setting avoids repeating the Secret in every `ImageRepository`?"
    options:
      - id: a
        text: "`insecure: true`"
        explanation: "Not correct. It switches HTTPS off."
      - id: b
        text: "`interval: 1h`"
        explanation: "Not correct. It changes the scan rate."
      - id: c
        text: "`serviceAccountName` naming a `ServiceAccount` with `imagePullSecrets`"
        explanation: "Correct. The scans read the login from that account."
      - id: d
        text: "`exclusionList`"
        explanation: "Not correct. It removes tags."
    correct_option: c
    explanation: "Correct. The scans read the login from that account."

  - id: ats098-final-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the provider for a cloud registry"
    source_readings:
      - sections/section-010/module-02/course-04-cloud-registries-tls-and-proxies.md
    prompt: "An `ImageRepository` scans a registry on a cloud that issues short-lived tokens from the identity of the workload. Which field selects that way of logging in?"
    options:
      - id: a
        text: "`secretRef`"
        explanation: "Not correct. It names a stored login."
      - id: b
        text: "`certSecretRef`"
        explanation: "Not correct. It holds a certificate authority."
      - id: c
        text: "`proxySecretRef`"
        explanation: "Not correct. It holds proxy settings."
      - id: d
        text: "`provider`, set to `aws`, `azure` or `gcp`"
        explanation: "Correct. The controller then gets the token itself."
    correct_option: d
    explanation: "Correct. The controller then gets the token itself."

  - id: ats098-final-q14
    type: single_choice
    difficulty: advanced
    learning_objective: "Read an authentication error"
    source_readings:
      - sections/section-010/module-02/course-05-diagnosing-authentication-errors.md
    prompt: "The scan of a private registry reports `401 Unauthorized`. Which two objects do you check first?"
    options:
      - id: a
        text: "The `Secret` named by `secretRef` and the registry address in it"
        explanation: "Correct. A wrong password, a wrong type or a wrong address all give a `401`."
      - id: b
        text: "The `ImagePolicy` range and the `filterTags` pattern"
        explanation: "Not correct. The policy runs after a successful scan."
      - id: c
        text: "The `GitRepository` branch and the `Kustomization` path"
        explanation: "Not correct. They only deliver the manifest."
      - id: d
        text: "The `Alert` and the `Provider`"
        explanation: "Not correct. Notifications do not affect the scan."
    correct_option: a
    explanation: "Correct. A wrong password, a wrong type or a wrong address all give a `401`."

  - id: ats098-final-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a tilde range"
    source_readings:
      - sections/section-010/module-03/course-01-semantic-version-ranges.md
    prompt: "Which range does `~6.15.0` mean?"
    options:
      - id: a
        text: "`>=6.15.0 <7.0.0`"
        explanation: "Not correct. That is the caret range."
      - id: b
        text: "`>=6.0.0 <7.0.0`"
        explanation: "Not correct. That is `6.x`."
      - id: c
        text: "`>=6.15.0 <6.16.0`"
        explanation: "Correct. The tilde allows patch changes only."
      - id: d
        text: "`>=6.15.0`"
        explanation: "Not correct. That range has no upper limit."
    correct_option: c
    explanation: "Correct. The tilde allows patch changes only."

  - id: ats098-final-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Include release candidates in a range"
    source_readings:
      - sections/section-010/module-03/course-02-release-candidates-in-a-range.md
    prompt: "Why does the range `>=6.0.0 <7.0.0` skip `6.16.0-rc.1`?"
    options:
      - id: a
        text: "Release candidates are always excluded by the controller"
        explanation: "Not correct. A range with a pre-release part chooses them."
      - id: b
        text: "A pre-release fits a comparison only if the comparison has a pre-release part"
        explanation: "Correct. Use `>=6.0.0-0 <7.0.0-0` to include them."
      - id: c
        text: "The tag has a hyphen, which is not valid in a range"
        explanation: "Not correct. The hyphen is valid SemVer."
      - id: d
        text: "The upper limit `7.0.0` is wrong"
        explanation: "Not correct. The limit is fine; the missing pre-release part is the cause."
    correct_option: b
    explanation: "Correct. Use `>=6.0.0-0 <7.0.0-0` to include them."

  - id: ats098-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the digest setting that never reads digests"
    source_readings:
      - sections/section-010/module-03/course-03-reflecting-image-digests.md
    prompt: "Which `digestReflectionPolicy` value leaves `.status.latestRef.digest` empty?"
    options:
      - id: a
        text: "`Always`"
        explanation: "Not correct. It reads the digest at every interval."
      - id: b
        text: "`IfNotPresent`"
        explanation: "Not correct. It reads the digest once for each chosen tag."
      - id: c
        text: "`Never`"
        explanation: "Correct. It records the tag only."
      - id: d
        text: "`Latest`"
        explanation: "Not correct. That is not a valid value."
    correct_option: c
    explanation: "Correct. It records the tag only."

  - id: ats098-final-q18
    type: single_choice
    difficulty: advanced
    learning_objective: "Place the interval"
    source_readings:
      - sections/section-010/module-03/course-04-scan-and-reflection-timing.md
    prompt: "A policy sets `digestReflectionPolicy: Always` and no `interval`. What happens?"
    options:
      - id: a
        text: "The controller uses the interval of the `ImageRepository`"
        explanation: "Not correct. The policy needs its own value."
      - id: b
        text: "The controller reads the digest once a minute"
        explanation: "Not correct. There is no default for this field."
      - id: c
        text: "The policy is accepted and the digest is read once"
        explanation: "Not correct. The API refuses the object."
      - id: d
        text: "The API refuses the policy, because `Always` requires `spec.interval`"
        explanation: "Correct. Add an interval such as `1m`."
    correct_option: d
    explanation: "Correct. Add an interval such as `1m`."

  - id: ats098-final-q19
    type: single_choice
    difficulty: advanced
    learning_objective: "Tell a scan fault from a policy fault"
    source_readings:
      - sections/section-010/module-03/course-05-reading-status-and-troubleshooting-policies.md
    prompt: "`flux get image repository podinfo` shows the right tag count, and `flux get image policy podinfo` is `Ready` but shows an older tag than expected. Where is the cause most likely?"
    options:
      - id: a
        text: "In the policy rule or filter, because the scan already holds the newer tag"
        explanation: "Correct. The scan is healthy, so the rule leaves the newer tag out."
      - id: b
        text: "In the registry login"
        explanation: "Not correct. The scan works."
      - id: c
        text: "In the cluster network"
        explanation: "Not correct. The scan reached the registry."
      - id: d
        text: "In the Git credentials"
        explanation: "Not correct. They do not affect a policy."
    correct_option: a
    explanation: "Correct. The scan is healthy, so the rule leaves the newer tag out."

  - id: ats098-final-q020x01
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose the marker suffix for a repository field"
    source_readings:
      - sections/section-020/module-02/course-01-setter-markers-in-helm-values.md
    prompt: "Which marker suffix writes only the image name, for a Helm values field `repository:`?"
    options:
      - id: a
        text: "`:name`"
        explanation: "Correct. It writes the name of the image that the ImageRepository scans."
      - id: b
        text: "`:tag`"
        explanation: "Not correct. It writes only the tag."
      - id: c
        text: "`:digest`"
        explanation: "Not correct. It writes only the digest."
      - id: d
        text: "No suffix"
        explanation: "Not correct. It writes the full `name:tag`."
    correct_option: a
    explanation: "Correct. It writes the name of the image that the ImageRepository scans."

  - id: ats098-final-q020x02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Set digestReflectionPolicy correctly"
    source_readings:
      - sections/section-020/module-02/course-02-pinning-images-by-digest.md
    prompt: "A policy must notice when a registry owner pushes a different image under the same tag. Which setting does that?"
    options:
      - id: a
        text: "`digestReflectionPolicy: Never`"
        explanation: "Not correct. No digest is stored."
      - id: b
        text: "`digestReflectionPolicy: IfNotPresent`"
        explanation: "Not correct. The digest is stored once and not checked again."
      - id: c
        text: "`digestReflectionPolicy: Always` with `spec.interval`"
        explanation: "Correct. The policy reads the digest at every interval."
      - id: d
        text: "`exclusionList` on the ImageRepository"
        explanation: "Not correct. It leaves tags out of the scan."
    correct_option: c
    explanation: "Correct. The policy reads the digest at every interval."

  - id: ats098-final-q020x03
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the update strategy"
    source_readings:
      - sections/section-020/module-02/course-03-update-paths-and-the-setters-strategy.md
    prompt: "Which `update.strategy` does an ImageUpdateAutomation use?"
    options:
      - id: a
        text: "`Patches`"
        explanation: "Not correct. No such strategy exists."
      - id: b
        text: "`Setters`"
        explanation: "Correct. It is the only strategy and the default."
      - id: c
        text: "`Merge`"
        explanation: "Not correct. No such strategy exists."
      - id: d
        text: "`Overlay`"
        explanation: "Not correct. No such strategy exists."
    correct_option: b
    explanation: "Correct. It is the only strategy and the default."

  - id: ats098-final-q020x04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use Changed.Changes in a template"
    source_readings:
      - sections/section-020/module-02/course-04-commit-message-templates.md
    prompt: "Which fields does each entry of `.Changed.Changes` have?"
    options:
      - id: a
        text: "`.Name`, `.Path` and `.Line`"
        explanation: "Not correct. These fields do not exist."
      - id: b
        text: "`.OldValue`, `.NewValue` and `.Setter`"
        explanation: "Correct. They give the value before, the value after and the marker."
      - id: c
        text: "`.Author` and `.Branch`"
        explanation: "Not correct. The author and branch are set in the spec."
      - id: d
        text: "`.Digest` and `.Tag`"
        explanation: "Not correct. These are not fields of a change."
    correct_option: b
    explanation: "Correct. They give the value before, the value after and the marker."

  - id: ats098-final-q020x05
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose the right push field"
    source_readings:
      - sections/section-020/module-02/course-05-signing-commits-and-push-options.md
    prompt: "The checkout branch is `main`, and the automation must push its commit to the branch `auto`. Which field does that?"
    options:
      - id: a
        text: "`spec.git.push.refspec: refs/heads/main:refs/heads/auto`"
        explanation: "Correct. A refspec maps the local reference to the remote reference."
      - id: b
        text: "`spec.update.path: auto`"
        explanation: "Not correct. The path selects files."
      - id: c
        text: "`spec.git.commit.author.name: auto`"
        explanation: "Not correct. It sets the author."
      - id: d
        text: "`spec.sourceRef.name: auto`"
        explanation: "Not correct. It names the GitRepository."
    correct_option: a
    explanation: "Correct. A refspec maps the local reference to the remote reference."

  - id: ats098-final-q020x06
    type: single_choice
    difficulty: beginner
    learning_objective: "List all image objects"
    source_readings:
      - sections/section-020/module-03/course-01-reading-the-state-of-the-image-objects.md
    prompt: "Which command lists the repositories, the policies and the automations in one output?"
    options:
      - id: a
        text: "`flux get image all`"
        explanation: "Correct. Add `-A` to include every namespace."
      - id: b
        text: "`flux get images`"
        explanation: "Not correct. The subcommand is `image`, not `images`."
      - id: c
        text: "`flux list image`"
        explanation: "Not correct. Flux has no `list` command."
      - id: d
        text: "`flux image get`"
        explanation: "Not correct. The order of the words is `get image`."
    correct_option: a
    explanation: "Correct. Add `-A` to include every namespace."

  - id: ats098-final-q020x07
    type: single_choice
    difficulty: beginner
    learning_objective: "Trace a Deployment to its commit"
    source_readings:
      - sections/section-020/module-03/course-02-tracing-a-release.md
    prompt: "Which command prints the Flux Kustomization, the GitRepository and the revision behind a Deployment?"
    options:
      - id: a
        text: "`flux trace deployment podinfo -n podinfo`"
        explanation: "Correct. It follows the labels that Flux puts on applied objects."
      - id: b
        text: "`flux get deployment podinfo`"
        explanation: "Not correct. Flux has no such command."
      - id: c
        text: "`flux events --for Deployment/podinfo`"
        explanation: "Not correct. That reads events."
      - id: d
        text: "`flux logs deployment/podinfo`"
        explanation: "Not correct. That reads controller logs."
    correct_option: a
    explanation: "Correct. It follows the labels that Flux puts on applied objects."

  - id: ats098-final-q020x08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Make a pause last"
    source_readings:
      - sections/section-020/module-03/course-03-suspending-and-resuming-automation.md
    prompt: "`flux suspend image update podinfo` can be undone at the next sync. What makes the pause last?"
    options:
      - id: a
        text: "`spec.suspend: true` in the file in Git"
        explanation: "Correct. The Flux Kustomization applies Git, so the pause is part of the desired state."
      - id: b
        text: "Running `flux suspend` every minute"
        explanation: "Not correct. It is a workaround that fails when you stop."
      - id: c
        text: "Deleting the ImageRepository"
        explanation: "Not correct. That removes the scan, and Git still holds the object."
      - id: d
        text: "Restarting the notification controller"
        explanation: "Not correct. It has no effect on the object."
    correct_option: a
    explanation: "Correct. The Flux Kustomization applies Git, so the pause is part of the desired state."

  - id: ats098-final-q020x09
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the two notification objects"
    source_readings:
      - sections/section-020/module-03/course-04-alerts-and-providers-for-image-events.md
    prompt: "Which two objects send image events out of the cluster?"
    options:
      - id: a
        text: "`Receiver` and `Webhook`"
        explanation: "Not correct. A Receiver takes events in."
      - id: b
        text: "`Provider` and `Alert`"
        explanation: "Correct. The Provider says where to send, and the Alert says what to send."
      - id: c
        text: "`Notifier` and `Channel`"
        explanation: "Not correct. These kinds do not exist."
      - id: d
        text: "`EventSource` and `EventSink`"
        explanation: "Not correct. These kinds do not exist."
    correct_option: b
    explanation: "Correct. The Provider says where to send, and the Alert says what to send."

  - id: ats098-final-q020x10
    type: single_choice
    difficulty: advanced
    learning_objective: "Match a symptom to a cause"
    source_readings:
      - sections/section-020/module-03/course-05-common-failure-causes.md
    prompt: "The policy chose `6.15.0`, the automation is ready and its log says it cannot find a policy. Which fault fits?"
    options:
      - id: a
        text: "The marker names a policy that does not exist"
        explanation: "Correct. The controller looks up the policy named in the marker."
      - id: b
        text: "The registry has no TLS"
        explanation: "Not correct. That is a scan fault, and the policy chose a tag."
      - id: c
        text: "The Deployment has no probes"
        explanation: "Not correct. That does not affect the automation."
      - id: d
        text: "The Alert has no provider"
        explanation: "Not correct. That stops events, not commits."
    correct_option: a
    explanation: "Correct. The controller looks up the policy named in the marker."

  - id: ats098-final-030-q01
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write explicit step weights"
    source_readings:
      - sections/section-030/module-02/course-02-canary-release-steps-and-autoscaling.md
    prompt: "A Canary has `stepWeights: [10, 30, 60]`. What does Flagger do?"
    options:
      - id: a
        text: "It adds 10% at every step up to a maximum"
        explanation: "Not correct. That is `stepWeight` with `maxWeight`."
      - id: b
        text: "It moves the canary to 10%, then 30%, then 60% of the traffic"
        explanation: "Correct. `stepWeights` lists the weight of each step."
      - id: c
        text: "It runs three iterations with no traffic share"
        explanation: "Not correct. Iterations are used for A/B and blue/green."
      - id: d
        text: "It sends 10% to three canaries"
        explanation: "Not correct. A Canary has one canary Deployment."
    correct_option: b
    explanation: "Correct. `stepWeights` lists the weight of each step."

  - id: ats098-final-030-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Match a Canary field to its strategy"
    source_readings:
      - sections/section-030/module-02/course-03-ab-testing-with-headers-and-cookies.md
    prompt: "Which pair of fields turns a Canary into an A/B test?"
    options:
      - id: a
        text: "`stepWeight` and `maxWeight`"
        explanation: "Not correct. They give a weighted release."
      - id: b
        text: "`mirror` and `mirrorWeight`"
        explanation: "Not correct. They give mirroring."
      - id: c
        text: "`iterations` and `match`"
        explanation: "Correct. Only requests that match reach the canary, for a set number of iterations."
      - id: d
        text: "`skipAnalysis` and `threshold`"
        explanation: "Not correct. They do not select a strategy."
    correct_option: c
    explanation: "Correct. Only requests that match reach the canary, for a set number of iterations."

  - id: ats098-final-030-q03
    type: single_choice
    difficulty: advanced
    learning_objective: "Match a cookie for A/B testing"
    source_readings:
      - sections/section-030/module-02/course-03-ab-testing-with-headers-and-cookies.md
    prompt: "Which request reaches the canary when the Canary matches the cookie `canary`?"
    options:
      - id: a
        text: "A request with `Cookie: canary=true`"
        explanation: "Not correct. ingress-nginx routes on the value `always`."
      - id: b
        text: "A request with the header `canary: always`"
        explanation: "Not correct. That is a header, not a cookie."
      - id: c
        text: "Every request in the first iteration"
        explanation: "Not correct. Only matching requests reach the canary."
      - id: d
        text: "A request with `Cookie: canary=always`"
        explanation: "Correct. ingress-nginx sends a request to the canary when the cookie value is `always`."
    correct_option: d
    explanation: "Correct. ingress-nginx sends a request to the canary when the cookie value is `always`."

  - id: ats098-final-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "State what mirroring needs"
    source_readings:
      - sections/section-030/module-02/course-04-blue-green-and-traffic-mirroring.md
    prompt: "Why does the playground not run traffic mirroring?"
    options:
      - id: a
        text: "ingress-nginx cannot mirror traffic the way Flagger needs, so a mesh or Gateway API is required"
        explanation: "Correct. The nginx provider has no mirroring, so the strategy is explained but not run."
      - id: b
        text: "The load tester blocks mirrored requests"
        explanation: "Not correct. The limit is in the router."
      - id: c
        text: "Mirroring needs a `maxWeight` of 100"
        explanation: "Not correct. `maxWeight` is not related."
      - id: d
        text: "Mirroring works only for A/B tests"
        explanation: "Not correct. It is set with `mirror` on a canary release."
    correct_option: a
    explanation: "Correct. The nginx provider has no mirroring, so the strategy is explained but not run."

  - id: ats098-final-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the phase of a release"
    source_readings:
      - sections/section-030/module-02/course-05-reading-the-canary-status.md
    prompt: "Which phase shows that Flagger waits for a `confirm-promotion` webhook?"
    options:
      - id: a
        text: "`Waiting`"
        explanation: "Not correct. That phase waits for `confirm-rollout`."
      - id: b
        text: "`Promoting`"
        explanation: "Not correct. That phase copies the canary to the primary."
      - id: c
        text: "`WaitingPromotion`"
        explanation: "Correct. The release stops before the promotion until the gate opens."
      - id: d
        text: "`Finalising`"
        explanation: "Not correct. That phase cleans up after the promotion."
    correct_option: c
    explanation: "Correct. The release stops before the promotion until the gate opens."

  - id: ats098-final-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a placeholder in a MetricTemplate"
    source_readings:
      - sections/section-030/module-03/course-01-built-in-metrics-and-metrictemplates.md
    prompt: "What does `{{ namespace }}` hold in a MetricTemplate query?"
    options:
      - id: a
        text: "The namespace of the MetricTemplate"
        explanation: "Not correct. Flagger fills in the target's namespace."
      - id: b
        text: "The namespace of Prometheus"
        explanation: "Not correct. That is part of the address."
      - id: c
        text: "Always `default`"
        explanation: "Not correct. It follows the target."
      - id: d
        text: "The namespace of the Canary target"
        explanation: "Correct. Flagger replaces it before it sends the query."
    correct_option: d
    explanation: "Correct. Flagger replaces it before it sends the query."

  - id: ats098-final-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Test a query by hand"
    source_readings:
      - sections/section-030/module-03/course-02-writing-and-testing-prometheus-queries.md
    prompt: "Why test a query against the Prometheus API before the Canary uses it?"
    options:
      - id: a
        text: "To see the number Flagger will compare with the limit"
        explanation: "Correct. A wrong query is found in seconds instead of during a release."
      - id: b
        text: "To install the metric in Prometheus"
        explanation: "Not correct. The query only reads data."
      - id: c
        text: "To reset the request counters"
        explanation: "Not correct. Reading changes nothing."
      - id: d
        text: "To skip the analysis interval"
        explanation: "Not correct. The interval still applies."
    correct_option: a
    explanation: "Correct. A wrong query is found in seconds instead of during a release."

  - id: ats098-final-030-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick a webhook type"
    source_readings:
      - sections/section-030/module-03/course-03-webhooks-and-gates.md
    prompt: "Which webhook type holds a release before the analysis starts?"
    options:
      - id: a
        text: "`pre-rollout`"
        explanation: "Not correct. It runs once and a failure counts as a failed check."
      - id: b
        text: "`confirm-rollout`"
        explanation: "Correct. The phase is `Waiting` until the webhook answers with a success status."
      - id: c
        text: "`post-rollout`"
        explanation: "Not correct. It runs after the result."
      - id: d
        text: "`rollback`"
        explanation: "Not correct. It forces a rollback."
    correct_option: b
    explanation: "Correct. The phase is `Waiting` until the webhook answers with a success status."

  - id: ats098-final-030-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the load tester gate"
    source_readings:
      - sections/section-030/module-03/course-03-webhooks-and-gates.md
    prompt: "What does a request to `/gate/open` do?"
    options:
      - id: a
        text: "It starts the load test"
        explanation: "Not correct. The load test is a `cmd` webhook."
      - id: b
        text: "It promotes the canary"
        explanation: "Not correct. It only opens a gate."
      - id: c
        text: "It deletes the Canary"
        explanation: "Not correct. It changes only the gate state."
      - id: d
        text: "It opens the gate, so `/gate/check` answers 200"
        explanation: "Correct. A `confirm-rollout` webhook on `/gate/check` then passes."
    correct_option: d
    explanation: "Correct. A `confirm-rollout` webhook on `/gate/check` then passes."

  - id: ats098-final-030-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Order the causes of a stuck release"
    source_readings:
      - sections/section-030/module-03/course-05-troubleshooting-a-failing-release.md
    prompt: "A canary release fails because the load test sends requests with the wrong host. Which cause is it?"
    options:
      - id: a
        text: "No traffic reaches the canary"
        explanation: "Correct. The metric check finds no values, so the target probably receives no traffic."
      - id: b
        text: "The new pods are not ready"
        explanation: "Not correct. Readiness problems show before traffic is shifted."
      - id: c
        text: "A metric is outside its range because the version is slow"
        explanation: "Not correct. With no traffic the query finds no values."
      - id: d
        text: "A `confirm-promotion` webhook fails"
        explanation: "Not correct. The release would wait in `WaitingPromotion`."
    correct_option: a
    explanation: "Correct. The metric check finds no values, so the target probably receives no traffic."
