# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats098-030
course_id: ATS098
exam_code: FLUX
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Progressive Delivery With Flagger"
placement:
  position: after
  reading: sections/section-030/capstone/labs/lab-01/question.md
questions:
  - id: ats098-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain how Flagger shifts traffic with nginx"
    source_readings:
      - sections/section-030/module-01/course-01-flagger-and-the-canary-resource.md
    prompt: "With `provider: nginx`, how does Flagger shift traffic to a new version?"
    options:
      - id: a
        text: "It proxies every request itself"
        explanation: "Not correct. Flagger does not handle user requests."
      - id: b
        text: "It edits the iptables rules on each node"
        explanation: "Not correct. Flagger works through the Ingress."
      - id: c
        text: "It changes the weight of a canary Ingress that ingress-nginx uses"
        explanation: "Correct. Flagger tells the router the share. The router sends the requests."
      - id: d
        text: "It scales the old Deployment down in steps"
        explanation: "Not correct. Scaling does not set a share of requests."
    correct_option: c
    explanation: "Correct. Flagger tells the router the share. The router sends the requests."

  - id: ats098-030-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Name where the success rate comes from"
    source_readings:
      - sections/section-030/module-01/course-01-flagger-and-the-canary-resource.md
    prompt: "Where does Flagger get the request counts for `request-success-rate` in this course?"
    options:
      - id: a
        text: "From Prometheus, which collects the request counts of ingress-nginx"
        explanation: "Correct. The Flagger chart installs `flagger-prometheus` for this."
      - id: b
        text: "From the Pod logs of the canary"
        explanation: "Not correct. Flagger does not parse logs."
      - id: c
        text: "From the ImagePolicy status"
        explanation: "Not correct. A policy knows tags, not requests."
      - id: d
        text: "From the Flux notification controller"
        explanation: "Not correct. That controller sends alerts and does not measure requests."
    correct_option: a
    explanation: "Correct. The Flagger chart installs `flagger-prometheus` for this."

  - id: ats098-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name an object that Flagger creates"
    source_readings:
      - sections/section-030/module-01/course-01-flagger-and-the-canary-resource.md
    prompt: "Which object does Flagger create when it takes over the Deployment `podinfo`?"
    options:
      - id: a
        text: "The Deployment `podinfo-stable`"
        explanation: "Not correct. Flagger names the copy `-primary`."
      - id: b
        text: "The HelmRelease `podinfo-canary`"
        explanation: "Not correct. Flagger creates Services, a Deployment and an Ingress, not a HelmRelease."
      - id: c
        text: "The GitRepository `podinfo-primary`"
        explanation: "Not correct. Flagger does not create Flux source objects."
      - id: d
        text: "The Deployment `podinfo-primary`"
        explanation: "Correct. It is a copy of `podinfo` that serves all traffic."
    correct_option: d
    explanation: "Correct. It is a copy of `podinfo` that serves all traffic."

  - id: ats098-030-q04
    type: single_choice
    difficulty: advanced
    learning_objective: "Know why Git holds no Service or replicas"
    source_readings:
      - sections/section-030/module-01/course-01-flagger-and-the-canary-resource.md
    prompt: "Why does Git hold no Service `podinfo` and no `replicas` field for the Deployment `podinfo`?"
    options:
      - id: a
        text: "Kubernetes does not allow Services and replicas in Git"
        explanation: "Not correct. They are valid fields. Ownership is the issue."
      - id: b
        text: "Flagger owns the Service and scales the Deployment, so a second owner in Git would fight it"
        explanation: "Correct. Flux would set the values back after each change by Flagger."
      - id: c
        text: "The Canary reads them from the Ingress"
        explanation: "Not correct. The Canary does not read them from the Ingress."
      - id: d
        text: "Flux never applies Services"
        explanation: "Not correct. Flux applies any object in the path."
    correct_option: b
    explanation: "Correct. Flux would set the values back after each change by Flagger."

  - id: ats098-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what starts an analysis"
    source_readings:
      - sections/section-030/module-01/course-02-canary-analysis-promotion-and-rollback.md
    prompt: "What starts a Flagger analysis?"
    options:
      - id: a
        text: "A change to the pod template of the target Deployment, such as a new image tag"
        explanation: "Correct. A change to the Canary alone does not start one."
      - id: b
        text: "Any change to the Canary object"
        explanation: "Not correct. Only a change to the target Deployment starts it."
      - id: c
        text: "A new commit anywhere in the repository"
        explanation: "Not correct. Only a changed pod template matters."
      - id: d
        text: "Creating the Ingress `podinfo-canary`"
        explanation: "Not correct. Flagger creates that Ingress itself."
    correct_option: a
    explanation: "Correct. A change to the Canary alone does not start one."

  - id: ats098-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Calculate the traffic steps"
    source_readings:
      - sections/section-030/module-01/course-02-canary-analysis-promotion-and-rollback.md
    prompt: "A Canary has `stepWeight: 25` and `maxWeight: 50`. Which canary weights does a good release pass before the promotion?"
    options:
      - id: a
        text: "50 only"
        explanation: "Not correct. The weight rises by `stepWeight` each check."
      - id: b
        text: "25, 50, 75, then 100"
        explanation: "Not correct. The weight stops at `maxWeight`."
      - id: c
        text: "25, then 50"
        explanation: "Correct. When `maxWeight` is reached, Flagger promotes."
      - id: d
        text: "10, 20, 30, 40, then 50"
        explanation: "Not correct. The step is 25, not 10."
    correct_option: c
    explanation: "Correct. When `maxWeight` is reached, Flagger promotes."

  - id: ats098-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain threshold and rollback"
    source_readings:
      - sections/section-030/module-01/course-02-canary-analysis-promotion-and-rollback.md
    prompt: "A Canary has `threshold: 5`. A release fails the metric check five times. What happens, and what does Git say afterwards?"
    options:
      - id: a
        text: "Flagger rolls back and reverts the commit in Git"
        explanation: "Not correct. Flagger never writes to Git."
      - id: b
        text: "Flagger rolls back and the primary keeps the old version; Git still names the new version"
        explanation: "Correct. Flagger does not change Git."
      - id: c
        text: "Flagger promotes the release anyway"
        explanation: "Not correct. Reaching the threshold ends the release as failed."
      - id: d
        text: "Flagger waits and retries forever"
        explanation: "Not correct. The threshold ends the analysis."
    correct_option: b
    explanation: "Correct. Flagger does not change Git."

  - id: ats098-030-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the A/B testing fields"
    source_readings:
      - sections/section-030/module-01/course-03-ab-testing-blue-green-and-metrics.md
    prompt: "Which `analysis` fields make a Canary an A/B test?"
    options:
      - id: a
        text: "`stepWeight` and `maxWeight`"
        explanation: "Not correct. Those fields give a weighted canary release."
      - id: b
        text: "`threshold` and `interval` only"
        explanation: "Not correct. They exist in every strategy."
      - id: c
        text: "`mirror` and `webhooks` only"
        explanation: "Not correct. `mirror` sets mirroring and needs a router that supports it."
      - id: d
        text: "`iterations` and `match`"
        explanation: "Correct. Only requests that match a header or cookie reach the canary."
    correct_option: d
    explanation: "Correct. Only requests that match a header or cookie reach the canary."

  - id: ats098-030-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe blue/green traffic"
    source_readings:
      - sections/section-030/module-01/course-03-ab-testing-blue-green-and-metrics.md
    prompt: "In a blue/green Canary, who receives the new version while it is tested?"
    options:
      - id: a
        text: "A growing random share of all users"
        explanation: "Not correct. That describes the canary release."
      - id: b
        text: "Only users who send a matching header"
        explanation: "Not correct. That describes A/B testing."
      - id: c
        text: "Nobody except the test webhooks, then all users switch at once"
        explanation: "Correct. There is no `match`, so users stay on the old version until the promotion."
      - id: d
        text: "Half of the users for the whole test"
        explanation: "Not correct. Blue/green has no user share."
    correct_option: c
    explanation: "Correct. There is no `match`, so users stay on the old version until the promotion."

  - id: ats098-030-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Set the limit of a custom latency metric"
    source_readings:
      - sections/section-030/module-01/course-03-ab-testing-blue-green-and-metrics.md
    prompt: "A MetricTemplate returns the 99th percentile request duration in seconds. Which `thresholdRange` fails a canary that is too slow?"
    options:
      - id: a
        text: "`max: 0.5`"
        explanation: "Correct. Latency needs a maximum. A higher value fails the check."
      - id: b
        text: "`min: 0.5`"
        explanation: "Not correct. A minimum would fail fast responses."
      - id: c
        text: "`min: 99`"
        explanation: "Not correct. That value fits a success rate in percent."
      - id: d
        text: "`stepWeight: 0.5`"
        explanation: "Not correct. That is not a `thresholdRange` field."
    correct_option: a
    explanation: "Correct. Latency needs a maximum. A higher value fails the check."

  - id: ats098-030-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the providers that run blue/green only"
    source_readings:
      - sections/section-030/module-02/course-01-flagger-providers-and-installation.md
    prompt: "Which Flagger provider supports blue/green but has no built-in metrics?"
    options:
      - id: a
        text: "`nginx`"
        explanation: "Not correct. It supports canary and A/B testing and has built-in metrics."
      - id: b
        text: "`kubernetes`"
        explanation: "Correct. The `kubernetes` provider only switches Services, so checks come from webhooks."
      - id: c
        text: "`istio`"
        explanation: "Not correct. It supports every strategy and has built-in metrics."
      - id: d
        text: "`prometheus`"
        explanation: "Not correct. That is a metrics source, not a provider."
    correct_option: b
    explanation: "Correct. The `kubernetes` provider only switches Services, so checks come from webhooks."

  - id: ats098-030-q12
    type: single_choice
    difficulty: beginner
    learning_objective: "Install Flagger for ingress-nginx"
    source_readings:
      - sections/section-030/module-02/course-01-flagger-providers-and-installation.md
    prompt: "Which Helm value tells the Flagger chart to use ingress-nginx?"
    options:
      - id: a
        text: "`provider: nginx` on the chart"
        explanation: "Not correct. `provider` is a field of the Canary, not a chart value."
      - id: b
        text: "`ingress.class: nginx`"
        explanation: "Not correct. The chart has no such value."
      - id: c
        text: "`meshProvider: nginx`"
        explanation: "Correct. `meshProvider` sets the router the controller starts with."
      - id: d
        text: "`router: nginx`"
        explanation: "Not correct. The chart has no `router` value."
    correct_option: c
    explanation: "Correct. `meshProvider` sets the router the controller starts with."

  - id: ats098-030-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write explicit step weights"
    source_readings:
      - sections/section-030/module-02/course-02-canary-release-steps-and-autoscaling.md
    prompt: "A Canary has `stepWeights: [10, 30, 60]`. What does Flagger do?"
    options:
      - id: a
        text: "It adds 10% at every step up to a maximum"
        explanation: "Not correct. That is `stepWeight` with `maxWeight`."
      - id: b
        text: "It runs three iterations with no traffic share"
        explanation: "Not correct. Iterations are used for A/B and blue/green."
      - id: c
        text: "It sends 10% to three canaries"
        explanation: "Not correct. A Canary has one canary Deployment."
      - id: d
        text: "It moves the canary to 10%, then 30%, then 60% of the traffic"
        explanation: "Correct. `stepWeights` lists the weight of each step."
    correct_option: d
    explanation: "Correct. `stepWeights` lists the weight of each step."

  - id: ats098-030-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use an autoscaler with a Canary"
    source_readings:
      - sections/section-030/module-02/course-02-canary-release-steps-and-autoscaling.md
    prompt: "What does Flagger do with an `autoscalerRef` that points at a HorizontalPodAutoscaler?"
    options:
      - id: a
        text: "It creates a primary autoscaler for the primary Deployment"
        explanation: "Correct. The primary gets its own HPA next to the one on the target."
      - id: b
        text: "It deletes the autoscaler during the analysis"
        explanation: "Not correct. The autoscaler is kept."
      - id: c
        text: "It scales the canary to the primary's replica count"
        explanation: "Not correct. The autoscaler decides the replicas."
      - id: d
        text: "It ignores the autoscaler"
        explanation: "Not correct. The reference is read and used."
    correct_option: a
    explanation: "Correct. The primary gets its own HPA next to the one on the target."

  - id: ats098-030-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Match a Canary field to its strategy"
    source_readings:
      - sections/section-030/module-02/course-03-ab-testing-with-headers-and-cookies.md
    prompt: "Which pair of fields turns a Canary into an A/B test?"
    options:
      - id: a
        text: "`stepWeight` and `maxWeight`"
        explanation: "Not correct. They give a weighted release."
      - id: b
        text: "`mirror` and `mirrorWeight`"
        explanation: "Not correct. They give mirroring."
      - id: c
        text: "`iterations` and `match`"
        explanation: "Correct. Only requests that match reach the canary, for a set number of iterations."
      - id: d
        text: "`skipAnalysis` and `threshold`"
        explanation: "Not correct. They do not select a strategy."
    correct_option: c
    explanation: "Correct. Only requests that match reach the canary, for a set number of iterations."

  - id: ats098-030-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Map an A/B match to ingress-nginx"
    source_readings:
      - sections/section-030/module-02/course-03-ab-testing-with-headers-and-cookies.md
    prompt: "With `provider: nginx`, how does Flagger apply a header match?"
    options:
      - id: a
        text: "It rewrites the Service selector"
        explanation: "Not correct. The Services stay as they are."
      - id: b
        text: "It changes the pod labels"
        explanation: "Not correct. Labels do not route requests."
      - id: c
        text: "It starts a sidecar proxy"
        explanation: "Not correct. nginx needs no sidecar."
      - id: d
        text: "It sets `canary-by-header` annotations on the canary Ingress"
        explanation: "Correct. Flagger creates a canary Ingress with the matching annotations."
    correct_option: d
    explanation: "Correct. Flagger creates a canary Ingress with the matching annotations."

  - id: ats098-030-q17
    type: single_choice
    difficulty: advanced
    learning_objective: "Match a cookie for A/B testing"
    source_readings:
      - sections/section-030/module-02/course-03-ab-testing-with-headers-and-cookies.md
    prompt: "Which request reaches the canary when the Canary matches the cookie `canary`?"
    options:
      - id: a
        text: "A request with `Cookie: canary=always`"
        explanation: "Correct. ingress-nginx sends a request to the canary when the cookie value is `always`."
      - id: b
        text: "A request with `Cookie: canary=true`"
        explanation: "Not correct. ingress-nginx routes on the value `always`."
      - id: c
        text: "A request with the header `canary: always`"
        explanation: "Not correct. That is a header, not a cookie."
      - id: d
        text: "Every request in the first iteration"
        explanation: "Not correct. Only matching requests reach the canary."
    correct_option: a
    explanation: "Correct. ingress-nginx sends a request to the canary when the cookie value is `always`."

  - id: ats098-030-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe a blue/green run"
    source_readings:
      - sections/section-030/module-02/course-04-blue-green-and-traffic-mirroring.md
    prompt: "What happens to users during the iterations of a blue/green Canary?"
    options:
      - id: a
        text: "They receive 50% of the traffic on the canary"
        explanation: "Not correct. No share is shifted."
      - id: b
        text: "They stay on the primary while tests run against the canary"
        explanation: "Correct. The switch happens once, at the promotion."
      - id: c
        text: "They are blocked until the promotion"
        explanation: "Not correct. The primary keeps answering."
      - id: d
        text: "They choose a version with a header"
        explanation: "Not correct. That is A/B testing."
    correct_option: b
    explanation: "Correct. The switch happens once, at the promotion."

  - id: ats098-030-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "State what mirroring needs"
    source_readings:
      - sections/section-030/module-02/course-04-blue-green-and-traffic-mirroring.md
    prompt: "Why does the playground not run traffic mirroring?"
    options:
      - id: a
        text: "The load tester blocks mirrored requests"
        explanation: "Not correct. The limit is in the router."
      - id: b
        text: "Mirroring needs a `maxWeight` of 100"
        explanation: "Not correct. `maxWeight` is not related."
      - id: c
        text: "Mirroring works only for A/B tests"
        explanation: "Not correct. It is set with `mirror` on a canary release."
      - id: d
        text: "ingress-nginx cannot mirror traffic the way Flagger needs, so a mesh or Gateway API is required"
        explanation: "Correct. The nginx provider has no mirroring, so the strategy is explained but not run."
    correct_option: d
    explanation: "Correct. The nginx provider has no mirroring, so the strategy is explained but not run."

  - id: ats098-030-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the phase of a release"
    source_readings:
      - sections/section-030/module-02/course-05-reading-the-canary-status.md
    prompt: "Which phase shows that Flagger waits for a `confirm-promotion` webhook?"
    options:
      - id: a
        text: "`WaitingPromotion`"
        explanation: "Correct. The release stops before the promotion until the gate opens."
      - id: b
        text: "`Waiting`"
        explanation: "Not correct. That phase waits for `confirm-rollout`."
      - id: c
        text: "`Promoting`"
        explanation: "Not correct. That phase copies the canary to the primary."
      - id: d
        text: "`Finalising`"
        explanation: "Not correct. That phase cleans up after the promotion."
    correct_option: a
    explanation: "Correct. The release stops before the promotion until the gate opens."

  - id: ats098-030-q21
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the built-in metrics"
    source_readings:
      - sections/section-030/module-03/course-01-built-in-metrics-and-metrictemplates.md
    prompt: "Which two metrics does Flagger provide for ingress-nginx?"
    options:
      - id: a
        text: "`error-rate` and `latency`"
        explanation: "Not correct. Those are names you give to a MetricTemplate."
      - id: b
        text: "`request-success-rate` and `request-duration`"
        explanation: "Correct. Success rate is a percentage and duration is the 99th percentile in milliseconds."
      - id: c
        text: "`cpu` and `memory`"
        explanation: "Not correct. Flagger does not read pod resources."
      - id: d
        text: "`request-count` and `request-size`"
        explanation: "Not correct. Those are not built in."
    correct_option: b
    explanation: "Correct. Success rate is a percentage and duration is the 99th percentile in milliseconds."

  - id: ats098-030-q22
    type: single_choice
    difficulty: beginner
    learning_objective: "Set the limit of a success-rate check"
    source_readings:
      - sections/section-030/module-03/course-01-built-in-metrics-and-metrictemplates.md
    prompt: "Which `thresholdRange` fits `request-success-rate`?"
    options:
      - id: a
        text: "`max: 99`"
        explanation: "Not correct. A maximum would fail good releases."
      - id: b
        text: "`min: 0.99`"
        explanation: "Not correct. The value is a percentage, not a fraction."
      - id: c
        text: "`min: 99`"
        explanation: "Correct. A higher success rate is better, so the check needs a minimum."
      - id: d
        text: "`stepWeight: 99`"
        explanation: "Not correct. That is not a `thresholdRange` field."
    correct_option: c
    explanation: "Correct. A higher success rate is better, so the check needs a minimum."

  - id: ats098-030-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a placeholder in a MetricTemplate"
    source_readings:
      - sections/section-030/module-03/course-01-built-in-metrics-and-metrictemplates.md
    prompt: "What does `{{ namespace }}` hold in a MetricTemplate query?"
    options:
      - id: a
        text: "The namespace of the Canary target"
        explanation: "Correct. Flagger replaces it before it sends the query."
      - id: b
        text: "The namespace of the MetricTemplate"
        explanation: "Not correct. Flagger fills in the target's namespace."
      - id: c
        text: "The namespace of Prometheus"
        explanation: "Not correct. That is part of the address."
      - id: d
        text: "Always `default`"
        explanation: "Not correct. It follows the target."
    correct_option: a
    explanation: "Correct. Flagger replaces it before it sends the query."

  - id: ats098-030-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Refer to a MetricTemplate"
    source_readings:
      - sections/section-030/module-03/course-01-built-in-metrics-and-metrictemplates.md
    prompt: "Which field of a metric in `analysis.metrics` points at a MetricTemplate?"
    options:
      - id: a
        text: "`providerRef`"
        explanation: "Not correct. That field belongs to alerts."
      - id: b
        text: "`templateRef`"
        explanation: "Correct. `templateRef` has a `name` and, when needed, a `namespace`."
      - id: c
        text: "`queryRef`"
        explanation: "Not correct. There is no such field."
      - id: d
        text: "`metricRef`"
        explanation: "Not correct. There is no such field."
    correct_option: b
    explanation: "Correct. `templateRef` has a `name` and, when needed, a `namespace`."

  - id: ats098-030-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Test a query by hand"
    source_readings:
      - sections/section-030/module-03/course-02-writing-and-testing-prometheus-queries.md
    prompt: "Why test a query against the Prometheus API before the Canary uses it?"
    options:
      - id: a
        text: "To install the metric in Prometheus"
        explanation: "Not correct. The query only reads data."
      - id: b
        text: "To reset the request counters"
        explanation: "Not correct. Reading changes nothing."
      - id: c
        text: "To see the number Flagger will compare with the limit"
        explanation: "Correct. A wrong query is found in seconds instead of during a release."
      - id: d
        text: "To skip the analysis interval"
        explanation: "Not correct. The interval still applies."
    correct_option: c
    explanation: "Correct. A wrong query is found in seconds instead of during a release."

  - id: ats098-030-q26
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain an empty query result"
    source_readings:
      - sections/section-030/module-03/course-02-writing-and-testing-prometheus-queries.md
    prompt: "A canary query returns an empty result. What does Flagger do?"
    options:
      - id: a
        text: "It treats the value as 0 and passes"
        explanation: "Not correct. An empty result is not a number."
      - id: b
        text: "It stops the controller"
        explanation: "Not correct. Only that Canary is affected."
      - id: c
        text: "It retries until the result has data and then passes"
        explanation: "Not correct. Each interval counts a failed check."
      - id: d
        text: "It counts a failed check and reports that no values were found"
        explanation: "Correct. The events say the target is probably not receiving traffic."
    correct_option: d
    explanation: "Correct. The events say the target is probably not receiving traffic."

  - id: ats098-030-q27
