# Flagger with the nginx provider and its bundled Prometheus, in the same
# namespace as ingress-nginx, and the load tester next to podinfo.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flagger
  targetNamespace: ingress-nginx
  dependsOn:
    - name: ingress-nginx
  install:
    createNamespace: true
  chart:
    spec:
      chart: flagger
      version: "1.45.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
  values:
    meshProvider: nginx
    prometheus:
      install: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger-loadtester
  namespace: flux-system
spec:
  interval: 30m
  releaseName: flagger-loadtester
  targetNamespace: podinfo
  install:
    createNamespace: true
  chart:
    spec:
      chart: loadtester
      version: "0.39.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
