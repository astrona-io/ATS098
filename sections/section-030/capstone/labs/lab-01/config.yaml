# Ship A Release From Registry To Primary
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-098-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the seeded fleet repository, the lab registry and Flux with the image controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-098-capstone-030-setup"
      description: "Seeds image automation and a Canary with three faults between the registry and podinfo-primary"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea, the lab registry and every Flux controller are ready"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The changes a correct learner makes, written to Git through the Gitea API; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-objects-in-git"
      description: "Confirms the policy and the automation come from Git and the automation updates apps/podinfo"
      type: "file"
      source: "validation/validate-objects-in-git.sh"
    - name: "validate-load-test"
      description: "Confirms the Canary load test calls the load tester in podinfo"
      type: "file"
      source: "validation/validate-load-test.sh"
    - name: "validate-release-promoted"
      description: "Adds podinfo 6.15.0 and follows it to a commit and a promotion by Flagger"
      type: "file"
      source: "validation/validate-release-promoted.sh"

teardown:
  keepCluster: false
