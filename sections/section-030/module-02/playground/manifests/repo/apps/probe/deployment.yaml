# No `replicas` field: Flagger scales this Deployment, so Git must not own the field.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: podinfo
  labels:
    app: probe
spec:
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: probe
          # The tag is set by images[].newTag in kustomization.yaml.
          image: ghcr.io/stefanprodan/podinfo:6.14.0
          env:
            - name: PODINFO_UI_MESSAGE
              value: "released by Flux"
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
