# Pick The Newest Stable Release
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-098-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the seeded fleet repository, the lab registry and Flux with the image controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-098-lab-010-01-setup"
      description: "Seeds the registry tags and an ImagePolicy in Git that picks the wrong tag"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea, the lab registry and every Flux controller are ready"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The changes a correct learner makes, written to Git through the Gitea API; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-policy-in-git"
      description: "Confirms the ImagePolicy podinfo comes from Git and uses a semver range"
      type: "file"
      source: "validation/validate-policy-in-git.sh"
    - name: "validate-policy-follows-releases"
      description: "Adds 6.15.1, 6.16.0-rc.2 and 7.0.0 and confirms the policy chooses 6.15.1"
      type: "file"
      source: "validation/validate-policy-follows-releases.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
      - regclient/regctl:v0.11.6-alpine
      - registry:2.8.3
