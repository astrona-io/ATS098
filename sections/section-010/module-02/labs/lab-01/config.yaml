# Scan A Private Registry
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-098-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the seeded fleet repository, the lab and private registries and Flux with the image controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-098-lab-010-02-setup"
      description: "Seeds the private registry tags and an ImageRepository in Git that cannot scan it"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea, the lab registry and every Flux controller are ready"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The changes a correct learner makes, written to Git through the Gitea API; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-scan-from-git"
      description: "Confirms the ImageRepository podinfo comes from Git, uses a docker config Secret and scans the private registry"
      type: "file"
      source: "validation/validate-scan-from-git.sh"
    - name: "validate-policy-follows-private-tags"
      description: "Adds 6.15.1 to the private registry and confirms the policy chooses it"
      type: "file"
      source: "validation/validate-policy-follows-private-tags.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
      - regclient/regctl:v0.11.6-alpine
      - registry:2.8.3
