# Describe Releases In Commit Messages
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-098-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the seeded fleet repository, the lab registry and Flux with the image controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-098-lab-020-02-setup"
      description: "Seeds podinfo 6.14.0, the scan, the policy, the setter marker and an automation with a fixed message"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea, the lab registry and every Flux controller are ready"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The changes a correct learner makes, written to Git through the Gitea API; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-marker-in-git"
      description: "Confirms the newTag line still carries the setter marker"
      type: "file"
      source: "validation/validate-marker-in-git.sh"
    - name: "validate-automation-in-git"
      description: "Confirms the ImageUpdateAutomation podinfo comes from Git, commits as release-bot@example.com and uses a template with Changed.Changes"
      type: "file"
      source: "validation/validate-automation-in-git.sh"
    - name: "validate-release-loop"
      description: "Adds podinfo 6.15.0 to the registry and checks the commit by release-bot and its message names the old and the new tag"
      type: "file"
      source: "validation/validate-release-loop.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
      - regclient/regctl:v0.11.6-alpine
      - registry:2.8.3
