# Automate The podinfo Release
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-098-lab-020-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs the Flux CLI 2.9.6, Gitea with the seeded fleet repository, the lab registry and Flux with the image controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-098-lab-020-01-setup"
      description: "Seeds podinfo 6.14.0, the scan and the policy; the release automation is the task"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea, the lab registry and every Flux controller are ready"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The changes a correct learner makes, written to Git through the Gitea API; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-marker-in-git"
      description: "Confirms the newTag line carries the setter marker for flux-system:podinfo:tag"
      type: "file"
      source: "validation/validate-marker-in-git.sh"
    - name: "validate-automation-in-git"
      description: "Confirms the ImageUpdateAutomation comes from Git with the right author, branch and path"
      type: "file"
      source: "validation/validate-automation-in-git.sh"
    - name: "validate-release-loop"
      description: "Adds podinfo 6.15.0 to the registry and follows it to a commit by fluxcdbot and the running Deployment"
      type: "file"
      source: "validation/validate-release-loop.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
      - regclient/regctl:v0.11.6-alpine
      - registry.localtest.me:5000
      - registry:2.8.3
