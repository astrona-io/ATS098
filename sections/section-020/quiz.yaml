# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats098-020
course_id: ATS098
exam_code: FLUX
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "Automated Git Write-Backs"
placement:
  position: after
  reading: sections/section-020/capstone/labs/lab-01/question.md
questions:
  - id: ats098-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Define a setter marker"
    source_readings:
      - sections/section-020/module-01/course-01-setter-markers.md
    prompt: "What is a setter marker?"
    options:
      - id: a
        text: "A Kubernetes annotation on the Deployment"
        explanation: "Not correct. A marker is a comment in a YAML file in Git."
      - id: b
        text: "A YAML comment at the end of a line that holds a JSON object with the key `$imagepolicy`"
        explanation: "Correct. The automation controller reads it and replaces the value on that line."
      - id: c
        text: "A field in the ImagePolicy spec"
        explanation: "Not correct. The marker is in the file that is changed, not in the policy."
      - id: d
        text: "A label that Flux adds to the Pod"
        explanation: "Not correct. Markers live in Git files, not on cluster objects."
    correct_option: b
    explanation: "Correct. The automation controller reads it and replaces the value on that line."

  - id: ats098-020-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the marker form that writes only the tag"
    source_readings:
      - sections/section-020/module-01/course-01-setter-markers.md
    prompt: "Which marker makes the automation write only the tag of the policy `podinfo` in `flux-system`?"
    options:
      - id: a
        text: "`# {\"$imagepolicy\": \"flux-system:podinfo\"}`"
        explanation: "Not correct. Without a suffix the full reference is written."
      - id: b
        text: "`# {\"$imagepolicy\": \"flux-system:podinfo:name\"}`"
        explanation: "Not correct. The `:name` suffix writes the image name only."
      - id: c
        text: "`# {\"$imagepolicy\": \"flux-system:podinfo:digest\"}`"
        explanation: "Not correct. The `:digest` suffix writes the digest and needs `digestReflectionPolicy`."
      - id: d
        text: "`# {\"$imagepolicy\": \"flux-system:podinfo:tag\"}`"
        explanation: "Correct. The `:tag` suffix writes the tag only."
    correct_option: d
    explanation: "Correct. The `:tag` suffix writes the tag only."

  - id: ats098-020-q03
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain why the tag-only form fits the lab"
    source_readings:
      - sections/section-020/module-01/course-01-setter-markers.md
    prompt: "The policy scans the lab registry, but the cluster pulls from `ghcr.io/stefanprodan/podinfo`. Why does the lab use the `:tag` marker on `newTag`?"
    options:
      - id: a
        text: "The full form is not allowed in a Kustomize file"
        explanation: "Not correct. The reason is the registry name, not the file type."
      - id: b
        text: "The `:tag` form makes the scan faster"
        explanation: "Not correct. Markers have no effect on the scan."
      - id: c
        text: "The full form would write the lab registry name into the file and the cluster could not pull from it"
        explanation: "Correct. Only the tag must change."
      - id: d
        text: "The `:tag` form is the only one that works without an ImageUpdateAutomation"
        explanation: "Not correct. Every form needs an ImageUpdateAutomation."
    correct_option: c
    explanation: "Correct. Only the tag must change."

  - id: ats098-020-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know that a marker alone changes nothing"
    source_readings:
      - sections/section-020/module-01/course-01-setter-markers.md
    prompt: "A setter marker is committed, and no ImageUpdateAutomation exists. What happens when the policy chooses a new tag?"
    options:
      - id: a
        text: "Nothing. The marker is a comment until an ImageUpdateAutomation covers its file"
        explanation: "Correct. Neither Kubernetes nor Kustomize reads the comment."
      - id: b
        text: "Kustomize writes the new tag into the file"
        explanation: "Not correct. Kustomize does not read the marker."
      - id: c
        text: "The image reflector controller commits the new tag"
        explanation: "Not correct. It scans and chooses. It does not write to Git."
      - id: d
        text: "The Deployment restarts with the new tag"
        explanation: "Not correct. The cluster follows Git, and Git did not change."
    correct_option: a
    explanation: "Correct. Neither Kubernetes nor Kustomize reads the comment."

  - id: ats098-020-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Spot a marker that names no policy"
    source_readings:
      - sections/section-020/module-01/course-01-setter-markers.md
    prompt: "A marker names a policy that does not exist, for example because of a typo. What does the automation do with that line?"
    options:
      - id: a
        text: "It writes the latest tag of the registry"
        explanation: "Not correct. Without a policy, there is no choice to write."
      - id: b
        text: "It deletes the line"
        explanation: "Not correct. The automation only replaces values of valid markers."
      - id: c
        text: "It stops Flux from reconciling the Kustomization"
        explanation: "Not correct. The automation does not affect other controllers."
      - id: d
        text: "It leaves the line alone, without an error that stops the run"
        explanation: "Correct. The value stays as it is, so the typo is easy to miss."
    correct_option: d
    explanation: "Correct. The value stays as it is, so the typo is easy to miss."

  - id: ats098-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order the steps of an ImageUpdateAutomation run"
    source_readings:
      - sections/section-020/module-01/course-02-image-update-automation.md
    prompt: "Which order describes one run of the image automation controller?"
    options:
      - id: a
        text: "Find markers, clone the branch, push, then commit"
        explanation: "Not correct. The controller needs the files before it can find markers, and it commits before it pushes."
      - id: b
        text: "Clone the branch, find markers under `update.path`, replace the values, commit if a file changed, push"
        explanation: "Correct. A run without changes makes no commit."
      - id: c
        text: "Scan the registry, choose a tag, replace the values, apply to the cluster"
        explanation: "Not correct. Scanning belongs to the reflector controller and applying to Flux."
      - id: d
        text: "Commit, replace the values, clone the branch, push"
        explanation: "Not correct. It must clone before it can change anything."
    correct_option: b
    explanation: "Correct. A run without changes makes no commit."

  - id: ats098-020-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose an update.path that misses the file"
    source_readings:
      - sections/section-020/module-01/course-02-image-update-automation.md
    prompt: "`update.path` points at a folder that does not contain the marked file. What is the result?"
    options:
      - id: a
        text: "The controller finds no markers and never commits"
        explanation: "Correct. The path is relative to the repository root."
      - id: b
        text: "The controller searches the whole repository anyway"
        explanation: "Not correct. It searches only under `update.path`."
      - id: c
        text: "The controller commits an empty change"
        explanation: "Not correct. It commits only when a file changed."
      - id: d
        text: "The controller creates the missing file"
        explanation: "Not correct. It only edits existing marked values."
    correct_option: a
    explanation: "Correct. The path is relative to the repository root."

  - id: ats098-020-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Run the release loop by hand"
    source_readings:
      - sections/section-020/module-01/course-02-image-update-automation.md
    prompt: "Which commands, in order, move a new registry tag to a rollout without waiting for intervals?"
    options:
      - id: a
        text: "`flux reconcile kustomization --with-source`, then `flux reconcile image update`, then `flux reconcile image repository`"
        explanation: "Not correct. The order is reversed. The commit does not exist before the scan."
      - id: b
        text: "`flux reconcile image update` only"
        explanation: "Not correct. The scan and the apply still wait for their intervals."
      - id: c
        text: "`flux reconcile image repository`, then `flux reconcile image update`, then `flux reconcile kustomization --with-source`"
        explanation: "Correct. They follow the loop: scan, commit, apply."
      - id: d
        text: "`kubectl rollout restart` on the Deployment"
        explanation: "Not correct. The Deployment image comes from Git, so a restart changes nothing."
    correct_option: c
    explanation: "Correct. They follow the loop: scan, commit, apply."

  - id: ats098-020-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use push.branch for reviewed releases"
    source_readings:
      - sections/section-020/module-01/course-03-commits-authors-and-branches.md
    prompt: "The automation checks out `main` and has `push.branch: image-updates`. When does a new tag reach the cluster?"
    options:
      - id: a
        text: "Immediately, because the automation commits"
        explanation: "Not correct. Flux does not apply the branch `image-updates`."
      - id: b
        text: "After someone merges `image-updates` into `main`, because Flux applies `main`"
        explanation: "Correct. Until the merge, the release waits in the branch."
      - id: c
        text: "Never, because pushing to another branch is not allowed"
        explanation: "Not correct. It is allowed and used for review."
      - id: d
        text: "After the next scan of the registry"
        explanation: "Not correct. A scan does not merge branches."
    correct_option: b
    explanation: "Correct. Until the merge, the release waits in the branch."

  - id: ats098-020-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Avoid the removed .Updated template field"
    source_readings:
      - sections/section-020/module-01/course-03-commits-authors-and-branches.md
    prompt: "A commit message template uses `.Updated` and fails. Which field replaces it in the current Flux version?"
    options:
      - id: a
        text: "`.Values`"
        explanation: "Not correct. It holds extra values you set yourself."
      - id: b
        text: "`.AutomationObject`"
        explanation: "Not correct. It holds the namespace and name of the automation."
      - id: c
        text: "`.Diff`"
        explanation: "Not correct. No such field exists."
      - id: d
        text: "`.Changed`"
        explanation: "Correct. `.Changed.FileChanges`, `.Changed.Objects` and `.Changed.Changes` hold what changed."
    correct_option: d
    explanation: "Correct. `.Changed.FileChanges`, `.Changed.Objects` and `.Changed.Changes` hold what changed."

  - id: ats098-020-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose the marker suffix for a repository field"
    source_readings:
      - sections/section-020/module-02/course-01-setter-markers-in-helm-values.md
    prompt: "Which marker suffix writes only the image name, for a Helm values field `repository:`?"
    options:
      - id: a
        text: "`:name`"
        explanation: "Correct. It writes the name of the image that the ImageRepository scans."
      - id: b
        text: "`:tag`"
        explanation: "Not correct. It writes only the tag."
      - id: c
        text: "`:digest`"
        explanation: "Not correct. It writes only the digest."
      - id: d
        text: "No suffix"
        explanation: "Not correct. It writes the full `name:tag`."
    correct_option: a
    explanation: "Correct. It writes the name of the image that the ImageRepository scans."

  - id: ats098-020-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain which image name a marker writes"
    source_readings:
      - sections/section-020/module-02/course-01-setter-markers-in-helm-values.md
    prompt: "The policy scans `registry.localtest.me:5000/podinfo` and the cluster pulls `ghcr.io/stefanprodan/podinfo`. A `:name` marker is on the `repository:` field. What does the controller write?"
    options:
      - id: a
        text: "`ghcr.io/stefanprodan/podinfo`"
        explanation: "Not correct. The controller does not know where the cluster pulls from."
      - id: b
        text: "`registry.localtest.me:5000/podinfo`"
        explanation: "Correct. It writes the name of the image that the ImageRepository scans."
      - id: c
        text: "The digest of the image"
        explanation: "Not correct. The suffix `:name` never writes a digest."
      - id: d
        text: "Nothing, because the file is not applied"
        explanation: "Not correct. The controller edits any marked YAML file under the path."
    correct_option: b
    explanation: "Correct. It writes the name of the image that the ImageRepository scans."

  - id: ats098-020-q13
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain why a digest is stronger than a tag"
    source_readings:
      - sections/section-020/module-02/course-02-pinning-images-by-digest.md
    prompt: "Why can a digest pin a release more exactly than a tag?"
    options:
      - id: a
        text: "A tag can be moved to another image and a digest identifies exactly one image"
        explanation: "Correct. The digest is the hash of the image manifest."
      - id: b
        text: "A digest is shorter than a tag"
        explanation: "Not correct. A digest is 64 hexadecimal characters after `sha256:`."
      - id: c
        text: "A tag is only used by Helm"
        explanation: "Not correct. Tags are used by every registry client."
      - id: d
        text: "A digest is chosen by the cluster"
        explanation: "Not correct. The registry computes it from the manifest."
    correct_option: a
    explanation: "Correct. The digest is the hash of the image manifest."

  - id: ats098-020-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Set digestReflectionPolicy correctly"
    source_readings:
      - sections/section-020/module-02/course-02-pinning-images-by-digest.md
    prompt: "A policy must notice when a registry owner pushes a different image under the same tag. Which setting does that?"
    options:
      - id: a
        text: "`digestReflectionPolicy: Never`"
        explanation: "Not correct. No digest is stored."
      - id: b
        text: "`digestReflectionPolicy: IfNotPresent`"
        explanation: "Not correct. The digest is stored once and not checked again."
      - id: c
        text: "`digestReflectionPolicy: Always` with `spec.interval`"
        explanation: "Correct. The policy reads the digest at every interval."
      - id: d
        text: "`exclusionList` on the ImageRepository"
        explanation: "Not correct. It leaves tags out of the scan."
    correct_option: c
    explanation: "Correct. The policy reads the digest at every interval."

  - id: ats098-020-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the digest of the chosen image"
    source_readings:
      - sections/section-020/module-02/course-02-pinning-images-by-digest.md
    prompt: "Where does Flux keep the digest of the image that a policy chose?"
    options:
      - id: a
        text: "`.status.latestRef.digest`"
        explanation: "Correct. It is next to `.status.latestRef.tag`."
      - id: b
        text: "`.spec.digest`"
        explanation: "Not correct. The spec holds what you configure."
      - id: c
        text: "`.status.lastScanResult.digest`"
        explanation: "Not correct. The scan result holds the tag count and the latest tags."
      - id: d
        text: "`.metadata.annotations.digest`"
        explanation: "Not correct. Flux does not store it there."
    correct_option: a
    explanation: "Correct. It is next to `.status.latestRef.tag`."

  - id: ats098-020-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the update strategy"
    source_readings:
      - sections/section-020/module-02/course-03-update-paths-and-the-setters-strategy.md
    prompt: "Which `update.strategy` does an ImageUpdateAutomation use?"
    options:
      - id: a
        text: "`Patches`"
        explanation: "Not correct. No such strategy exists."
      - id: b
        text: "`Setters`"
        explanation: "Correct. It is the only strategy and the default."
      - id: c
        text: "`Merge`"
        explanation: "Not correct. No such strategy exists."
      - id: d
        text: "`Overlay`"
        explanation: "Not correct. No such strategy exists."
    correct_option: b
    explanation: "Correct. It is the only strategy and the default."

  - id: ats098-020-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Diagnose an automation that never commits"
    source_readings:
      - sections/section-020/module-02/course-03-update-paths-and-the-setters-strategy.md
    prompt: "An ImageUpdateAutomation is Ready, its policy chose a new tag, and no commit appears. `update.path` is `./clusters`, and the marker is in `apps/podinfo`. What is the cause?"
    options:
      - id: a
        text: "The controller found no marker under the path"
        explanation: "Correct. It reads only the files under `update.path`."
      - id: b
        text: "The policy is suspended"
        explanation: "Not correct. The policy chose a new tag."
      - id: c
        text: "The Git server is down"
        explanation: "Not correct. A failed push would show an error."
      - id: d
        text: "The marker needs the suffix `:digest`"
        explanation: "Not correct. The suffix decides what is written, not whether the file is read."
    correct_option: a
    explanation: "Correct. It reads only the files under `update.path`."

  - id: ats098-020-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use Changed.Changes in a template"
    source_readings:
      - sections/section-020/module-02/course-04-commit-message-templates.md
    prompt: "Which fields does each entry of `.Changed.Changes` have?"
    options:
      - id: a
        text: "`.Name`, `.Path` and `.Line`"
        explanation: "Not correct. These fields do not exist."
      - id: b
        text: "`.OldValue`, `.NewValue` and `.Setter`"
        explanation: "Correct. They give the value before, the value after and the marker."
      - id: c
        text: "`.Author` and `.Branch`"
        explanation: "Not correct. The author and branch are set in the spec."
      - id: d
        text: "`.Digest` and `.Tag`"
        explanation: "Not correct. These are not fields of a change."
    correct_option: b
    explanation: "Correct. They give the value before, the value after and the marker."

  - id: ats098-020-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the Secret entry for a signing key"
    source_readings:
      - sections/section-020/module-02/course-05-signing-commits-and-push-options.md
    prompt: "Which entry must the Secret of `signingKey.secretRef` hold?"
    options:
      - id: a
        text: "`git.asc`"
        explanation: "Correct. It holds the ASCII-armored private key."
      - id: b
        text: "`identity`"
        explanation: "Not correct. That entry is for an SSH key."
      - id: c
        text: "`tls.crt`"
        explanation: "Not correct. That entry is for a certificate."
      - id: d
        text: "`signing.key`"
        explanation: "Not correct. The controller does not read that name."
    correct_option: a
    explanation: "Correct. It holds the ASCII-armored private key."

  - id: ats098-020-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose the right push field"
    source_readings:
      - sections/section-020/module-02/course-05-signing-commits-and-push-options.md
    prompt: "The checkout branch is `main`, and the automation must push its commit to the branch `auto`. Which field does that?"
    options:
      - id: a
        text: "`spec.git.push.refspec: refs/heads/main:refs/heads/auto`"
        explanation: "Correct. A refspec maps the local reference to the remote reference."
      - id: b
        text: "`spec.update.path: auto`"
        explanation: "Not correct. The path selects files."
      - id: c
        text: "`spec.git.commit.author.name: auto`"
        explanation: "Not correct. It sets the author."
      - id: d
        text: "`spec.sourceRef.name: auto`"
        explanation: "Not correct. It names the GitRepository."
    correct_option: a
    explanation: "Correct. A refspec maps the local reference to the remote reference."

  - id: ats098-020-q21
    type: single_choice
    difficulty: beginner
    learning_objective: "List all image objects"
    source_readings:
      - sections/section-020/module-03/course-01-reading-the-state-of-the-image-objects.md
    prompt: "Which command lists the repositories, the policies and the automations in one output?"
    options:
      - id: a
        text: "`flux get image all`"
        explanation: "Correct. Add `-A` to include every namespace."
      - id: b
        text: "`flux get images`"
        explanation: "Not correct. The subcommand is `image`, not `images`."
      - id: c
        text: "`flux list image`"
        explanation: "Not correct. Flux has no `list` command."
      - id: d
        text: "`flux image get`"
        explanation: "Not correct. The order of the words is `get image`."
    correct_option: a
    explanation: "Correct. Add `-A` to include every namespace."

  - id: ats098-020-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Check that an automation runs"
    source_readings:
      - sections/section-020/module-03/course-01-reading-the-state-of-the-image-objects.md
    prompt: "An ImageUpdateAutomation shows `READY` as `True` and never commits. Which status field shows whether the controller runs at each interval?"
    options:
      - id: a
        text: "`.status.lastAutomationRunTime`"
        explanation: "Correct. If it moves forward, the controller runs and finds nothing to change."
      - id: b
        text: "`.status.lastScanResult`"
        explanation: "Not correct. That field belongs to an ImageRepository."
      - id: c
        text: "`.status.latestRef`"
        explanation: "Not correct. That field belongs to an ImagePolicy."
      - id: d
        text: "`.spec.interval`"
        explanation: "Not correct. It is the setting, not the result."
    correct_option: a
    explanation: "Correct. If it moves forward, the controller runs and finds nothing to change."

  - id: ats098-020-q23
    type: single_choice
    difficulty: beginner
    learning_objective: "Trace a Deployment to its commit"
    source_readings:
      - sections/section-020/module-03/course-02-tracing-a-release.md
    prompt: "Which command prints the Flux Kustomization, the GitRepository and the revision behind a Deployment?"
    options:
      - id: a
        text: "`flux trace deployment podinfo -n podinfo`"
        explanation: "Correct. It follows the labels that Flux puts on applied objects."
      - id: b
        text: "`flux get deployment podinfo`"
        explanation: "Not correct. Flux has no such command."
      - id: c
        text: "`flux events --for Deployment/podinfo`"
        explanation: "Not correct. That reads events."
      - id: d
        text: "`flux logs deployment/podinfo`"
        explanation: "Not correct. That reads controller logs."
    correct_option: a
    explanation: "Correct. It follows the labels that Flux puts on applied objects."

  - id: ats098-020-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell who made the last change"
    source_readings:
      - sections/section-020/module-03/course-02-tracing-a-release.md
    prompt: "`flux trace` shows a commit hash. How do you find out whether the automation made it?"
    options:
      - id: a
        text: "Read the author in `git log` for the marked file"
        explanation: "Correct. Release commits carry the author set in the automation."
      - id: b
        text: "Read the namespace of the Deployment"
        explanation: "Not correct. It says nothing about the commit."
      - id: c
        text: "Read `.spec.interval` of the policy"
        explanation: "Not correct. It does not identify a commit."
      - id: d
        text: "Restart the image reflector controller"
        explanation: "Not correct. That changes nothing about history."
    correct_option: a
    explanation: "Correct. Release commits carry the author set in the automation."

  - id: ats098-020-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Make a pause last"
    source_readings:
      - sections/section-020/module-03/course-03-suspending-and-resuming-automation.md
    prompt: "`flux suspend image update podinfo` can be undone at the next sync. What makes the pause last?"
    options:
      - id: a
        text: "`spec.suspend: true` in the file in Git"
        explanation: "Correct. The Flux Kustomization applies Git, so the pause is part of the desired state."
      - id: b
        text: "Running `flux suspend` every minute"
        explanation: "Not correct. It is a workaround that fails when you stop."
      - id: c
        text: "Deleting the ImageRepository"
        explanation: "Not correct. That removes the scan, and Git still holds the object."
      - id: d
        text: "Restarting the notification controller"
        explanation: "Not correct. It has no effect on the object."
    correct_option: a
    explanation: "Correct. The Flux Kustomization applies Git, so the pause is part of the desired state."

  - id: ats098-020-q26
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose what to suspend during a freeze"
    source_readings:
      - sections/section-020/module-03/course-03-suspending-and-resuming-automation.md
    prompt: "During a release freeze, which object should you suspend so the policy stays current?"
    options:
      - id: a
        text: "The ImageRepository"
        explanation: "Not correct. New tags stop appearing."
      - id: b
        text: "The ImageUpdateAutomation"
        explanation: "Correct. Commits stop, and the scan and the policy go on."
      - id: c
        text: "The GitRepository"
        explanation: "Not correct. Flux stops fetching every commit."
      - id: d
        text: "The notification controller"
        explanation: "Not correct. That stops events, not commits."
    correct_option: b
    explanation: "Correct. Commits stop, and the scan and the policy go on."

